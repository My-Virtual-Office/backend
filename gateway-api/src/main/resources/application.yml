server:
  port: 8080

spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/auth/**,/api/otp/**,/api/users/**
        - id: workspace-service
          uri: ${WORKSPACE_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/workspace/**,/api/invitations/**
        - id: chat-service
          uri: ${CHAT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/chat/**
        - id: room-service
          uri: ${ROOM_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/rooms/**
        - id: calendar-service
          uri: ${CALENDAR_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/calendar/**
        - id: tasks-service
          uri: ${TASKS_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/tasks/**
        - id: notifications-service
          uri: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notifications/**
        # AI assistant. Authenticated like everything else: the filter below
        # injects the trusted X-User-* headers and forwards the caller's bearer
        # token, which ai-service reuses for its own downstream calls — so the
        # assistant can only ever act with the signed-in user's permissions.
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/ai/**

# Shared signing secret with user-service; the gateway validates every token at the edge.
jwt:
  secret: ${JWT_SECRET:your-very-strong-secret-key-must-be-at-least-32-characters-long}

gateway:
  # Path prefixes served without authentication (comma-separated). Any path ending in /health is
  # also public. Everything else requires a valid JWT.
  # /api/chat/connect is the chat WebSocket handshake: browsers can't attach an
  # Authorization header to a WS upgrade, so it authenticates via a short-lived
  # ?ticket= validated by chat-service's handshake interceptor (not a JWT here).
  public-path-prefixes: /api/auth/,/api/otp/,/api/chat/connect,/api/chat/files/,/api/notifications/connect
  cors:
    # Browser origins allowed to call the API (comma-separated patterns). Defaults to any localhost
    # port for local dev; set to the real web origin(s) in production.
    allowed-origin-patterns: ${GATEWAY_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
