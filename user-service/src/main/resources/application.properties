server.port=8091
server.address=0.0.0.0
spring.application.name=user-service

spring.datasource.url=jdbc:mysql://localhost:3306/virtual_office
spring.datasource.username=root
spring.datasource.password=rootpassword

# jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# rabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

notifications.exchange=notifications.exchange
notifications.routing.key=routing.key

spring.docker.compose.lifecycle-management=start-and-stop

#jwt - 24 hours
jwt.secret=your-very-strong-secret-key-must-be-at-least-32-characters-long
jwt.expiration=86400000




# Metrics for Prometheus (scraped at /actuator/prometheus); health powers the compose healthcheck.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Export _bucket series so Grafana can compute p95/p99 with histogram_quantile().
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true
