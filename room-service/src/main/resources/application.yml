spring:
  application:
    name: room-service

  data:
    mongodb:
      uri: mongodb://root:rootpassword@localhost:27017/room_service?authSource=admin
      auto-index-creation: true

    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8086

room:
  exchange: room.exchange
  channel:
    routing-key: room.channel.event
  agora:
    channel-prefix: room-
    # Compose passes ROOM_AGORA_APP_ID / ROOM_AGORA_APP_CERTIFICATE, which Spring's relaxed
    # binding maps onto these keys; AGORA_APP_ID / AGORA_APP_CERTIFICATE work for bare `mvn`
    # runs. Blank certificate => AgoraTokenBuilder returns "" (App-ID-only, no token auth).
    app-id: ${AGORA_APP_ID:}
    app-certificate: ${AGORA_APP_CERTIFICATE:}
  redis:
    ticket-prefix: "room:ws-ticket:"
  presence:
    alive-ttl-seconds: 30
  ws:
    endpoint: /ws/rooms
    ticket-ttl-seconds: 60
  # Inbound server-to-server auth for /api/internal/** (the SkyOffice position feed, §4.2).
  internal:
    token: ${INTERNAL_API_TOKEN:dev-internal-token}
  voice:
    # Default proximity hearing radius (map units) for open areas without a zone-specific radius.
    proximity-default-radius: ${VOICE_PROXIMITY_RADIUS:150}

# Internal API of workspace-service for workspace membership/role checks (§4.1) and zones (§4.3).
workspace:
  service:
    base-url: ${WORKSPACE_SERVICE_URL:http://localhost:8087}
    internal-token: ${INTERNAL_API_TOKEN:dev-internal-token}
    zones-cache-ttl-seconds: ${WORKSPACE_ZONES_CACHE_TTL:30}

management:
  metrics:
    distribution:
      # Export _bucket series so Grafana can compute p95/p99 with histogram_quantile().
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.virtualoffice.room_service: INFO
    org.springframework.data.mongodb: INFO
    org.springframework.data.redis: INFO
    org.springframework.web.socket: DEBUG
